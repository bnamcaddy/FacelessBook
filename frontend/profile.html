<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacelessBook | Profile</title>
    <link rel="shortcut icon" type="image/png" href="favicon.png?v=1">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <div id="toast-container"></div>

        <!-- Top Navbar -->
        <nav class="navbar">
            <div class="nav-content">
                <a href="index.html" class="logo-area">
                    <img src="logo.png" alt="FacelessBook" class="nav-logo">
                    <span class="logo">FacelessBook</span>
                </a>
                <div class="header-actions">
                    <div class="search-container">
                        <div class="search-bar" id="search-bar">
                            <i class="fas fa-search search-icon"></i>
                            <input type="text" id="header-search-input" placeholder="Search FacelessBook">
                        </div>
                        <div id="search-results" class="search-results-dropdown"></div>
                    </div>

                    <div class="nav-right-actions">
                        <button class="nav-icon-btn" id="nav-plus-btn" title="Create"><i class="fas fa-plus"></i></button>
                        <button class="nav-icon-btn" id="nav-search-btn-mobile" title="Search"><i class="fas fa-search"></i></button>
                        <button class="nav-icon-btn" id="nav-menu-btn" title="Menu"><i class="fas fa-bars"></i></button>
                        
                        <div class="nav-user-profile" id="nav-profile-link">
                            <img src="https://via.placeholder.com/40" alt="" id="nav-profile-pic" class="nav-avatar">
                            <span id="nav-username"></span>
                        </div>
                    </div>

                    <!-- Dropdowns -->
                    <div class="dropdown-menu" id="plus-dropdown">
                        <div class="dropdown-item" onclick="openModal('post')"><i class="fas fa-pen-to-square"></i> Create Post</div>
                        <div class="dropdown-item" onclick="openModal('story')"><i class="fas fa-clock-rotate-left"></i> Create Story</div>
                        <div class="dropdown-item" onclick="openModal('reel')"><i class="fas fa-film"></i> Create Reel</div>
                        <div class="dropdown-item" onclick="openModal('note')"><i class="fas fa-sticky-note"></i> Create Note</div>
                    </div>

                    <div class="dropdown-menu" id="menu-dropdown">
                        <div class="dropdown-item" id="menu-profile-btn"><i class="fas fa-user"></i> Profile</div>
                        <div class="dropdown-item" onclick="window.location.href='settings.html'"><i class="fas fa-cog"></i> Settings</div>
                        <hr>
                        <div class="dropdown-item" id="logout-btn-new"><i class="fas fa-sign-out-alt"></i> Logout</div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Profile Content -->
        <main class="container single-col">
            <div class="profile-header glass-card">
                <div class="profile-cover"></div>
                <div class="profile-info-main">
                    <img src="https://via.placeholder.com/150" alt="" id="profile-pic" class="profile-picture">
                    <div class="profile-text">
                        <h1 id="profile-name">Loading...</h1>
                        <p id="profile-bio">Member since recently</p>
                    </div>
                    <div class="profile-header-actions" style="margin-bottom: 16px;">
                        <button class="primary-btn hidden" id="edit-profile-btn" style="padding: 10px 20px; border-radius: 8px; cursor: pointer;"><i class="fas fa-edit"></i> Edit Profile</button>
                    </div>
                </div>
                <div class="profile-tabs">
                    <div class="profile-tab active">Posts</div>
                    <div class="profile-tab">About</div>
                    <div class="profile-tab">Friends</div>
                    <div class="profile-tab">Photos</div>
                </div>
            </div>

            <div class="profile-body">
                <div id="user-posts-container">
                    <div class="empty-state">Loading posts...</div>
                </div>
            </div>
        </main>

        <!-- Create FAB Button -->
        <button class="create-fab" id="create-fab" title="Create"><i class="fas fa-plus"></i></button>
        <div class="create-menu" id="create-menu">
            <div class="create-menu-item" onclick="openModal('post')"><i class="fas fa-pen-to-square"></i> Create Post</div>
            <div class="create-menu-item" onclick="openModal('story')"><i class="fas fa-clock-rotate-left"></i> Create Story</div>
            <div class="create-menu-item" onclick="openModal('reel')"><i class="fas fa-film"></i> Create Reel</div>
            <div class="create-menu-item" onclick="openModal('note')"><i class="fas fa-sticky-note"></i> Create Note</div>
        </div>

        <!-- Create Modal -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modal-title">Create Post</h2>
                    <button class="modal-close" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body" id="modal-body"></div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
    <style>
        .profile-header { padding: 0; overflow: hidden; margin-bottom: 20px; }
        .profile-cover { height: 240px; background: linear-gradient(to bottom, var(--primary), #6c5ce7); border-radius: 0 0 12px 12px; }
        .profile-info-main { display: flex; align-items: flex-end; gap: 20px; padding: 0 32px; margin-top: -80px; position: relative; }
        .profile-picture { width: 160px; height: 160px; border-radius: 50%; border: 4px solid var(--white); background: var(--bg); object-fit: cover; }
        .profile-text { padding-bottom: 16px; flex: 1; }
        .profile-text h1 { font-size: 2rem; margin-bottom: 4px; }
        .profile-text p { color: var(--text-muted); }
        .profile-tabs { display: flex; border-top: 1px solid var(--border); margin-top: 16px; padding: 0 16px; }
        .profile-tab { padding: 16px 20px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .profile-tab:hover { background: var(--hover-bg); }
        .profile-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        @media (max-width: 768px) {
            .profile-info-main { flex-direction: column; align-items: center; text-align: center; margin-top: -60px; padding: 0 16px; }
            .profile-picture { width: 120px; height: 120px; }
            .profile-cover { height: 160px; }
            .profile-text { padding-bottom: 0; }
            .profile-tabs { justify-content: center; overflow-x: auto; }
            .profile-tab { padding: 12px 10px; font-size: 0.9rem; }
        }
    </style>
</body>
</html>
