<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Document Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacelessBook | Connect with Friends</title>
    <link rel="shortcut icon" type="image/png" href="favicon.png?v=1">
    
    <!-- Link to external CSS stylesheet for styling the application -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Import 'Outfit' font from Google Fonts for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/releases/v6.0.0/css/all.min.css">
</head>
<body>
    <!-- Main application wrapper -->
    <div id="app">
        <!-- Notification Area -->
        <div id="toast-container"></div>

        <!-- Main Application Section: The news feed and user interface -->
        <section id="main-section">
            <!-- Navigation bar at the top -->
            <nav class="navbar">
                <div class="nav-content">
                    <a href="#" class="logo-area">
                        <img src="logo.png" alt="FacelessBook" class="nav-logo">
                        <span class="logo">FacelessBook</span>
                    </a>
                    <div class="user-info">
                        <!-- Displays the logged-in user's name -->
                        <span id="nav-username"></span>
                        <button id="logout-btn">Log Out</button>
                    </div>
                </div>
            </nav>

            <!-- Main content container with sidebars and feed -->
            <main class="container">
                <!-- Left Sidebar: Navigation links -->
                <div class="sidebar left-sidebar">
                    <ul>
                        <li><a href="#"><i class="fas fa-home"></i> Feed</a></li>
                        <li><a href="#"><i class="fas fa-users"></i> Friends</a></li>
                        <li><a href="#"><i class="fas fa-comment-dots"></i> Messages</a></li>
                        <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                    </ul>
                </div>

                <!-- Center Section: Post creation and News Feed -->
                <div class="feed-section">
                    <!-- Text area for creating a new post -->
                    <div class="create-post glass-card">
                        <textarea id="post-content" placeholder="What's on your mind?"></textarea>
                        <button id="create-post-btn" class="primary-btn">Post</button>
                    </div>
                    <!-- Dynamic container where posts will be rendered -->
                    <div id="posts-container">
                        <!-- Posts will be injected here by JavaScript -->
                    </div>
                </div>

                <!-- Right Sidebar: Friends list -->
                <div class="sidebar right-sidebar">
                    <h3>Friends</h3>
                    <div id="friends-list">
                        <!-- Friend list items will be injected here by JavaScript -->
                        <p>No friends yet. Add some!</p>
                    </div>
                </div>
            </main>
        </section>
    </div>
    
    <!-- Link to external JavaScript file for application logic -->
    <script src="main.js"></script>
</body>
</html>
