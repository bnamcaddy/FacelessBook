<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | FacelessBook</title>
    <link rel="shortcut icon" type="image/png" href="favicon.png?v=1">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-container">
                <img src="logo.png" alt="FacelessBook Logo" class="app-logo">
                <h1>Reset Password</h1>
            </div>
            <p>Enter your email and a new password.</p>
            <div id="forgot-password-form">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="reset-email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reset-new-password" placeholder="New Password" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('reset-new-password', this)"></i>
                </div>
                <div class="input-group">
                    <i class="fas fa-shield-alt"></i>
                    <input type="password" id="reset-confirm-password" placeholder="Confirm New Password" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePassword('reset-confirm-password', this)"></i>
                </div>
                <button id="reset-btn" class="primary-btn">Reset Password</button>
                <div class="msg-container" id="reset-msg"></div>
                <p class="auth-switch">Remember your password? <a href="login.html">Log In</a></p>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
